[project]
name = "memoria"
version = "0.1.0"
description = "Episode-centric local memory runtime with graph salience and activation-gated working memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "pytest>=8.0",
  "sentence-transformers>=3.0",
  "sqlalchemy>=2.0",
  "typer>=0.12",
]

[project.scripts]
tame = "tame.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["tame"]
